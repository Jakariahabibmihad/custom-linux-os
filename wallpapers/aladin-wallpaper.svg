<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="1080" viewBox="0 0 1920 1080">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#17152f"/>
      <stop offset="100%" stop-color="#251744"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <circle cx="1450" cy="430" r="560" fill="url(#glow)"/>

  <g fill="none" stroke="#c4b5fd" stroke-opacity=".12">
    <circle cx="1450" cy="430" r="220" stroke-width="2"/>
    <circle cx="1450" cy="430" r="300" stroke-width="2"/>
    <circle cx="1450" cy="430" r="390" stroke-width="1"/>
    <circle cx="1450" cy="430" r="480" stroke-width="1"/>
  </g>

  <circle cx="1450" cy="430" r="155"
          fill="url(#orb)" opacity=".92"/>

  <circle cx="1400" cy="380" r="45"
          fill="#ffffff" opacity=".12"/>

  <path d="M0 850 Q420 650 850 890 T1920 760 V1080 H0Z"
        fill="#11172c" opacity=".75"/>

  <path d="M0 940 Q520 760 1040 960 T1920 900 V1080 H0Z"
        fill="#080d1a" opacity=".7"/>

  <g fill="#ffffff" opacity=".6">
    <circle cx="260" cy="190" r="2"/>
    <circle cx="490" cy="340" r="1.5"/>
    <circle cx="720" cy="155" r="2"/>
    <circle cx="1020" cy="280" r="1.5"/>
    <circle cx="1700" cy="170" r="2"/>
    <circle cx="1800" cy="620" r="1.5"/>
    <circle cx="1180" cy="640" r="2"/>
  </g>
</svg>
